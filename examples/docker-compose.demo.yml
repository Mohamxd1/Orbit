# Demo workloads for Orbit. Start Orbit first (it creates the "orbit" network):
#   docker compose up -d --build
#   docker compose -f examples/docker-compose.demo.yml up -d
services:
  # Healthy web server with an HTTP heartbeat Orbit can call.
  web:
    image: nginx:1.27-alpine
    labels:
      orbit.enable: "true"
      orbit.heartbeat.url: "http://web/"
    networks: [orbit]

  # Exits after 30 seconds: Orbit restarts it and records each recovery.
  flaky:
    image: busybox:1.36
    command: ["sh", "-c", "echo up; sleep 30; echo crashing; exit 1"]
    labels:
      orbit.enable: "true"
      orbit.cooldown: "20"
    networks: [orbit]

  # Always crashes: Orbit restarts it max_restarts times, then gives up.
  broken:
    image: busybox:1.36
    command: ["sh", "-c", "exit 1"]
    labels:
      orbit.enable: "true"
      orbit.cooldown: "5"
      orbit.max_restarts: "2"
    networks: [orbit]

networks:
  orbit:
    external: true
